<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dormitoration | Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/design/log_in.css">
    <script src="/script/theme.js" defer></script>
</head>

<body class="dark-mode">

    <!-- Top Navigation Header -->
    <header class="top-nav">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <i class='bx bxs-building-house'></i>
                <span>Dormitoration</span>
            </a>

            <nav class="nav-links">
                <a href="/index.html" class="nav-link-item">Home</a>
                <a href="/index.html#about" class="nav-link-item">About Us</a>
                <a href="/sign_up.html" class="btn-primary">Sign Up</a>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                    <i class='bx bx-moon' id="theme-icon"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="login-container">
        <div class="login-card">
            <div class="header">
                <h1>Dormitoration</h1>
                <p>Smart Dormitory Management System</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="identifier">Email or Student ID</label>
                    <input type="text" id="identifier" placeholder="Enter email or student ID" required
                        autocomplete="username">
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="javascript:void(0)" id="forgotPasswordBtn" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" placeholder="Enter password" required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div id="message"></div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/sign_up.html" class="signup-link">Sign Up</a></p>
            </div>
        </div>
    </main>

    <!-- Reset Password Modal Overlay -->
    <div id="forgotPasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-content reset-modal-content">
            <div class="modal-header">
                <h2><i class='bx bx-key'></i> Reset Password</h2>
                <button type="button" class="btn-icon" id="closeResetModalBtn" aria-label="Close modal">
                    <i class='bx bx-x'></i>
                </button>
            </div>
            <p class="modal-subtitle">Verify your account details to set a new password.</p>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <label for="resetIdentifier">Email or Username</label>
                    <input type="text" id="resetIdentifier" placeholder="Enter your registered email or username"
                        required>
                </div>

                <div class="input-group">
                    <label for="resetVerification">Phone Number (Verification)</label>
                    <input type="tel" id="resetVerification" placeholder="Enter your registered phone number" required>
                </div>

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min. 6 chars)" required
                        minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required
                        minlength="6">
                </div>

                <button type="submit" class="btn-submit">Reset Password</button>
            </form>

            <div id="resetMessage"></div>
        </div>
    </div>

    <!-- Scrollable Footer -->
    <footer class="main-footer">
        <div class="footer-container">
            <p>&copy; 2026 Dormitoration System — All rights reserved.</p>
        </div>
    </footer>

    <script src="/script/log_in.js" defer></script>
</body>

</html>
