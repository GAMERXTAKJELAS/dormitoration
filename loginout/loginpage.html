<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORMITORY IKML OFFICIAL</title>
</head>

<body class="loginout-body">
    <nav class="nav-container">
        <div class="nav-bar">
            <div class="logo">logo</div>
            <div class="nav">nav</div>
            <button class="loginout-button">Register</button>
        </div>
    </nav>
    <div class="login-container">
        <h1 class="login-form">Login Page</h1>
        <!-- Form block data that will send to loginout file -->
        <form class="login-form" action="#" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
<link rel="stylesheet" href="../css_design/loginout.css">
</html>
