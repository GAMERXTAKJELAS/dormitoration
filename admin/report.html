<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dormitoration | Reports</title>
    
    <link rel="stylesheet" href="/design/dashboard.css">
    <link rel="stylesheet" href="/design/report.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script src="/script/theme.js" defer></script>
    <script src="/script/logout_logic.js" defer></script>
</head>
<body>

    <!-- Logout Modal -->
    <div id="logout-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <i class='bx bx-log-out-circle' style="font-size: 3rem; color: #ef4444;"></i>
            <h2>Leave Session?</h2>
            <p>You are attempting to leave the admin area. Do you want to log out?</p>
            <div class="modal-btns">
                <button class="btn-secondary" onclick="closeLogoutModal()">Cancel</button>
                <button class="btn-danger" onclick="executeLogout()">Yes, Log Out</button>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar-nav">
        <div class="logo-section">
            <i class='bx bxs-building-house'></i>
            <span class="text" style="font-weight: bold; margin-left: 20px;">DORMITORY</span>
        </div>

        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="/admin/adminhomepage.html">
                    <i class='bx bx-home-alt icon'></i>
                    <span class="text">Home</span>
                </a></li>

                <li><a href="/admin/dashboard.html">
                    <i class='bx bxs-dashboard icon'></i>
                    <span class="text">Dashboard</span>
                </a></li>

                <li><a href="/admin/approval.html">
                    <i class='bx bxs-check-shield icon'></i>
                    <span class="text">Approval</span>
                </a></li>

                <li><a href="/admin/report.html" class="active">
                    <i class='bx bxs-report icon'></i>
                    <span class="text">Report</span>
                </a></li>

                <li><a href="/admin/setting.html">
                    <i class='bx bx-cog icon'></i>
                    <span class="text">Settings</span>
                </a></li>
            </ul>
        </nav>

        <div class="sidebar-footer" style="position: absolute; bottom: 20px; width: 100%; padding: 0 25px;">
            <button id="theme-toggle" class="theme-btn" style="background:none; border:none; cursor:pointer; color:var(--text-color); display:flex; align-items:center; gap:20px;">
                <i class='bx bx-moon' id="theme-icon" style="font-size: 22px;"></i>
                <span class="text">Theme</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Box -->
    <main class="main-box">
        <header class="report-header">
            <div>
                <h1>Activity Reports</h1>
                <p style="color: var(--text-muted, #64748b); margin-top: 4px; font-size: 0.9rem;">View and manage dormitory access logs and check-in history.</p>
            </div>
            <div class="report-actions">
                <button class="btn-export"><i class='bx bx-export'></i> Export CSV</button>
            </div>
        </header>

        <!-- Container Card -->
        <div class="content-card">
            
            <!-- Filters Toolbar -->
            <div class="filter-section">
                <div class="search-box">
                    <i class='bx bx-search search-icon'></i>
                    <input type="text" placeholder="Search student or ID..." class="input-field">
                </div>

                <div class="filter-controls">
                    <select class="filter-dropdown">
                        <option value="all">All Action</option>
                        <option value="entry">Entry</option>
                        <option value="exit">Exit</option>
                    </select>

                    <input type="date" class="filter-date">
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-wrapper">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Student Name</th>
                            <th>Student ID</th>
                            <th>Action</th>
                            <th style="text-align: right;">Status</th>
                        </tr>
                    </thead>
                    <tbody>

                        </tr>

                            <td style="text-align: right;"><span class="badge-warning">Late Entry</span></td>

                    </tbody>
                </table>
            </div>

        </div>
    </main>

</body>
</html>
