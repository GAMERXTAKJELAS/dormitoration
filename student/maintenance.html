<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dormitoration | System Maintenance</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #47f59b;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .icon-box {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-retry {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn-retry:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <i class='bx bx-wrench'></i>
        </div>
        <h1>System Under Maintenance</h1>
        <p>The student portal is currently undergoing scheduled upgrades or maintenance. Please check back shortly.</p>
        <a href="/login.html" class="btn-retry"><i class='bx bx-refresh'></i> Try Again</a>
    </div>
</body>
</html>
